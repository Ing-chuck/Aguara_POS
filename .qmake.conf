# qmake reads this file automatically for every project inside the repository.
# It defines one shared output tree, so the projects find each other's output
# no matter which build directory Qt Creator chooses:
#
#   <build>/bin/            aguara.exe + aguara_interfaces.dll
#   <build>/bin/modules/    module plugins (*.dll), loaded at runtime
#   <build>/lib/            import libraries used only while linking
#
# Build through Aguara_POS.pro (the top-level project). A sub-project opened on
# its own has no shared build root, so it stops with an error (see aguara.pri).

AGUARA_SRC_ROOT    = $$PWD
AGUARA_BUILD_ROOT  = $$shadowed($$PWD)
AGUARA_BIN_DIR     = $$AGUARA_BUILD_ROOT/bin
AGUARA_MODULES_DIR = $$AGUARA_BIN_DIR/modules
AGUARA_LIB_DIR     = $$AGUARA_BUILD_ROOT/lib
