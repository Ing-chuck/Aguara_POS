<text x="1020" y="662" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#52606D" text-anchor="start">Origen de los datos, avisos de conexión,</text>
<text x="1020" y="679" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#52606D" text-anchor="start">usuario, fecha y hora.</text>
