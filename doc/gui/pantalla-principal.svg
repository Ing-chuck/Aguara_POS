<text x="206" y="678" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<circle cx="1002" cy="489" r="10" fill="#B84A0A"/>
<text x="1002" y="493" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1020" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1F2933" text-anchor="start">Usuario</text>
<text x="1020" y="512" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#52606D" text-anchor="start">El candado bloquea la sesión (Ctrl+L).</text>
<circle cx="916" cy="218" r="10" fill="#B84A0A"/>
<text x="916" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
