<text x="1020" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1F2933" text-anchor="start">Avisos</text>
<text x="1020" y="420" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#52606D" text-anchor="start">F1 los abre. El punto amarillo indica</text>
<text x="1020" y="437" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#52606D" text-anchor="start">que hay avisos sin ver.</text>
