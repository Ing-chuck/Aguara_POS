<text x="1020" y="587" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#52606D" text-anchor="start">La aporta el módulo; el resto es del core.</text>
<circle cx="916" cy="725" r="10" fill="#B84A0A"/>
<text x="916" y="729" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
<circle cx="1002" cy="639" r="10" fill="#B84A0A"/>
<text x="1002" y="643" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
