<text x="1002" y="309" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1020" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1F2933" text-anchor="start">Barra lateral</text>
<text x="1020" y="328" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#52606D" text-anchor="start">Solo los módulos que el usuario puede abrir.</text>
<text x="1020" y="345" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#52606D" text-anchor="start">Ctrl+1 a Ctrl+9 los abren.</text>
