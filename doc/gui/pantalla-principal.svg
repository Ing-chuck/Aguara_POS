<text x="1002" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="1020" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1F2933" text-anchor="start">Pestañas</text>
<text x="1020" y="219" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#52606D" text-anchor="start">Ventas, con la caja abierta, va primera y sin X.</text>
<text x="1020" y="236" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#52606D" text-anchor="start">Avisos solo se cierra mientras una página</text>
<text x="1020" y="253" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#52606D" text-anchor="start">deba quedar abierta.</text>
<circle cx="206" cy="235" r="10" fill="#B84A0A"/>
<text x="206" y="239" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
