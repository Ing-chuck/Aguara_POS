<text x="70" y="465" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606D" text-anchor="start">Cada interfaz tiene un ID que termina en el nivel de API: org.AguaraPOS.ModuleInterface/9.</text>
<text x="70" y="485" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606D" text-anchor="start">El core lee ese ID de los metadatos del plugin: con otro nivel lo salta, sin cargar su código.</text>
<text x="70" y="505" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52606D" text-anchor="start">Servicios por service&lt;T&gt;(): Product, Inventory, User, Cash, Sales, Print, Customer, Return y Report.</text>
<rect x="40" y="545" width="1320" height="95" rx="6" ry="6" fill="#FFFFFF" stroke="#B84A0A" stroke-width="1.2"/>
<text x="60" y="571" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#B84A0A" text-anchor="start">En el core</text>
<text x="60" y="595" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2933" text-anchor="start">CoreHost implementa AguaraHost y lleva los avisos a la ventana. MainWindow::loadPlugins() revisa el nivel de API,</text>
<text x="60" y="617" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1F2933" text-anchor="start">carga cada DLL, llama a initialize() y pide las capacidades con qobject_cast.</text>
